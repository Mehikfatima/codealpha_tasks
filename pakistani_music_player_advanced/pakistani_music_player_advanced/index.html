<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pakistani Music Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="player-card">
      <div class="top-bar">
        <div>
          <p class="eyebrow">Now Playing</p>
          <h1>Music Player</h1>
        </div>
        <button id="themeBtn" class="icon-btn" title="Toggle theme">🌙</button>
      </div>

      <div class="artwork" id="artwork">
        <div class="vinyl"></div>
        <div class="music-note">♪</div>
      </div>

      <div class="song-info">
        <h2 id="song-title">No Song Loaded</h2>
        <p id="song-artist">Choose songs to start</p>
      </div>

      <audio id="audio" preload="metadata"></audio>

      <div class="progress-wrap">
        <div class="time-row">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
        <input type="range" id="progress" value="0" min="0" max="100" step="0.1" />
      </div>

      <div class="controls">
        <button id="shuffle" class="small-btn" title="Shuffle">🔀</button>
        <button id="prev" class="control-btn" title="Previous">⏮</button>
        <button id="play" class="play-btn" title="Play / Pause">▶</button>
        <button id="next" class="control-btn" title="Next">⏭</button>
        <button id="repeat" class="small-btn" title="Repeat">🔁</button>
      </div>

      <div class="volume-container">
        <span>🔊</span>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7" />
        <span id="volumeValue">70%</span>
      </div>

      <div class="file-picker" id="fileDrop">
        <input type="file" id="filePicker" multiple accept="audio/*" />
        <strong>Add your songs</strong>
        <span>Click here or drag & drop MP3/audio files</span>
      </div>
    </section>

    <aside class="playlist-card">
      <div class="playlist-head">
        <div>
          <p class="eyebrow">Library</p>
          <h2>Playlist</h2>
        </div>
        <button id="clearBtn" class="ghost-btn">Clear local</button>
      </div>

      <input id="search" class="search" type="search" placeholder="Search songs..." />

      <ul id="playlist"></ul>

      <p class="hint">
        Tip: Space = play/pause, ←/→ = seek, N = next, P = previous.
      </p>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
